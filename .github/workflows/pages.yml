name: Publish the site

# The landing page had never been reachable by anyone: no Pages site, no
# workflow, no homepage URL. A page nobody can open sells nothing, so this is
# the first half of the sales surface actually existing.
#
# The gates run BEFORE the deploy and block it. A page that quotes a number
# with no recorded method, or that fetches a font from Google, cannot reach
# the public -- the check is a gate, not a report.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/MEASUREMENTS.md'
      - 'scripts/presstalk_claims_gate.sh'
      - 'scripts/presstalk_site_privacy_gate.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every number in customer-facing copy has a recorded method
        run: ./scripts/presstalk_claims_gate.sh
      - name: The page makes no automatic third-party request
        run: python3 scripts/presstalk_site_privacy_gate.py
      - name: The stated offer matches the offer the app enforces
        run: python3 scripts/presstalk_offer_consistency_gate.py
      # A gate is only worth running if it can fail. These prove both can,
      # on the same runner that just reported the page clean.
      - name: Every download and checkout link resolves
        # A broken download button is invisible from inside the repo, and the
        # first person to discover it is a stranger who wanted the app.
        run: python3 scripts/presstalk_download_link_gate.py
      - name: The privacy gate still catches planted defects
        run: python3 scripts/test_presstalk_site_privacy_gate.py
      - name: The offer gate still catches planted defects
        run: python3 scripts/test_presstalk_offer_consistency_gate.py

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # The first run failed here: the repository had never had Pages turned
        # on, so there was no site to configure and nothing to deploy into.
        # enablement lets the workflow create it rather than requiring someone
        # to find the setting, which is how it stayed off for months.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
